<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asphatl 9: ReJends</title>
    <link rel="stylesheet" href="../css/subscription.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
    <script defer src="../js/subscription.js"></script>
</head>
<body>
    <nav class="navbar-container">
        <a href="../html/home.html">
            <img id="logo-asphalt" src="../assets/logo.png" alt="">
        </a>
        <div class="navbar">
            <a href="../html/home.html">Home</a>
            <a href="../html/products.html">Products</a>
            <a href="../html/news.html">News</a>
            <a href="../html/event.html">Event</a>
            <a href="../html/subscription.html" id="color-on">Subscription</a>
        </div>
    </nav>

    <section class="section-one">
        <div class="title-container">
            <div class="section-one-title">
                <p>Fill up the form and submit your application.</p>
            </div>
        </div>
        
        <div class="card-container">
            <div class="card">
                <form action="" class="form" id="formContact" method="GET"> 
                    <div class="input-form">
                        <label for="name">Name</label>
                        <input type="text" name="name" id="name" placeholder="Please enter your name">
                        <p class="error-message" id="invalid-name"></p>
                    </div>
                    <div class="input-form">
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" placeholder="Please enter your email">
                        <p class="error-message" id="invalid-email"></p>
                    </div>
                    <div class="input-form">
                        <label for="date">Date Of Birth</label>
                        <input type="date" name="date" id="date">
                        <p class="error-message" id="invalid-date"></p>
                    </div>
                    <div class="input-form">
                        <label>Gender</label>
                        <div class="gender-form">
                            <div>
                                <input type="radio" name="gender" id="male">
                                <label for="male">Male</label>
                            </div>
        
                            <div>
                                <input type="radio" name="gender" id="female">
                                <label for="female">Female</label>
                            </div>
                        </div>
                        <p class="error-message" id="invalid-gender"></p>
                    </div>
                    <div class="agree-form">
                        <input type="checkbox" id="agree">
                        <label for="">I agree to the Gameloft Terms and Conditions and I have read the Privacy Policy.</label>
                        <p class="error-message" id="invalid-agree"></p>
                    </div>
                </form>
                <div class="submit-button-container">
                    <button onclick="validate()" class="submit-button">
                        <div>
                            Submit
                        </div>
                    </button>
                </div>
                <img src="../assets/subscription-background.png" alt="" class="card-image">
            </div>
        </div>
    </section>
</body>
</html>
